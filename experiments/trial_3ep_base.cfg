[config]

mode = pretrain
pretrained_model = google/byt5-base

# Dataset
dataset_key = lecslab/polygloss-corpus
pretrain_with_dev = false
task_format = interleaved

# Training
max_epochs = 3
min_epochs = 3
learning_rate = 5e-5
batch_size = 32
gradient_accumulation_steps = 2
grad_norm = 1
optimizer = adamw
