[config]

mode = pretrain
pretrained_model = google/byt5-base

# Dataset
dataset_key = lecslab/polygloss-corpus
pretrain_with_dev = false
task_format = interleaved
max_tokens = 512

# Training
max_epochs = 3
min_epochs = 3
learning_rate = 5e-5
batch_size = 64
length_bucketed_batching = true
grad_norm = 1
optimizer = adamw
